<!-- Video dipindah ke luar pannable-layer agar resolusi 9:16-nya terjaga dan tidak melebar -->
<video id="maingame-bg-video" autoplay muted loop playsinline
    class="absolute inset-0 w-full h-full object-cover z-[-1] hidden">
    <source src="assets/videos/0002_intro03.m3u8" type="application/x-mpegURL">
</video>

<div id="pannable-layer" class="absolute z-0 transition-transform duration-300 ease-out"
    style="width: 392.06%; height: 123.08%; left: 50%; top: 50%; transform: translate(-50%, -50%);">
    <div id="background-layer" class="absolute inset-0 bg-cover bg-center"
        style="background-image: url('assets/images/apartment-day-bg.jpg');">
        <div class="overlay"></div>
    </div>

    <div id="safe-zone" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
        style="width: 25.506%; height: 81.249%;">
        <div id="door-exit-area"
            class="absolute right-9 top-[45%] -translate-y-1/2 w-14 h-28 rounded-lg flex flex-col items-center justify-center cursor-pointer transition-opacity duration-300 opacity-0 hidden z-30"
            style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);" onclick="GAME.logic.openCityMap()">
            <span class="text-2xl mb-1">🚪</span>
            <span class="text-[9px] font-bold text-center text-white drop-shadow-md">Keluar<br>Gedung</span>
        </div>
    </div>
</div>



<div id="phone-app-backdrop" class="absolute inset-0 bg-black/60 z-[5] hidden backdrop-blur-md pointer-events-none transition-opacity duration-300"></div>

<div id="dynamic-content"
    class="w-full flex-1 flex flex-col justify-end items-center z-10 pb-28 relative overflow-hidden pointer-events-none">

    <div id="view-apartment" class="panel-wrapper">
        <button id="apartment-view-toggle"
            class="minimize-toggle-btn w-8 h-8 rounded-full flex items-center justify-center glass-hud hover:bg-white/20 transition-all duration-300 pointer-events-auto"
            onclick="GAME.logic.toggleApartmentView()">
            <svg id="apartment-toggle-icon" xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 text-white transition-transform duration-500" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <div class="glass-panel-main flex flex-col w-[85%] max-w-[280px]">
            <div class="glass-section-title">Ruangan</div>
            <button class="glass-button" onclick="GAME.ui.changeView('view-kasur', false)">
                <span class="glass-button-icon">🛏️</span> Kasur
            </button>
            <button class="glass-button" onclick="GAME.ui.changeView('view-kitchen', false)">
                <span class="glass-button-icon">🍳</span> Dapur & Item
            </button>
            <button class="glass-button" onclick="GAME.ui.changeView('view-bathroom', false)">
                <span class="glass-button-icon">🚿</span> Kamar Mandi
            </button>
        </div>
    </div>

    <div id="view-kasur" class="glass-panel-main hidden flex-col mb-3">
        <div class="glass-section-title">Aksi Kasur</div>
        <button class="glass-button" onclick="GAME.logic.sleep(1)">
            <span class="glass-button-icon">🥱</span>
            <div class="glass-button-content">
                <span>Tidur Sebentar</span>
                <span class="glass-button-subtext">+30% Energy, Lewati 1 Waktu</span>
            </div>
        </button>
        <button class="glass-button" onclick="GAME.logic.sleep(3)">
            <span class="glass-button-icon">😴</span>
            <div class="glass-button-content">
                <span>Tidur Panjang</span>
                <span class="glass-button-subtext">+100% Energy, Lewati 3 Waktu</span>
            </div>
        </button>
        <div class="glass-section-title mt-4">Navigasi</div>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-apartment', false)">
            Kembali
        </button>
    </div>

    <div id="view-kitchen" class="glass-panel-main hidden flex-col h-[65vh] w-[90%] mb-3">
        <div class="flex justify-between items-center mb-3 border-b border-white/20 pb-2 shrink-0">
            <span class="glass-section-title m-0">Kulkas & Lemari</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.logic.closeInventory()">Kembali</button>
        </div>

        <div id="kitchen-inventory" class="overflow-y-auto flex-1 grid grid-cols-4 gap-2 content-start pb-2"></div>

        <div id="kitchen-preview"
            class="shrink-0 h-28 bg-black/40 rounded-xl border border-white/10 shadow-inner flex items-center p-3 gap-3 hidden mt-2">
            <div class="w-20 h-20 bg-white/5 rounded-lg flex items-center justify-center shrink-0 relative">
                <span id="kitchen-preview-fallback" class="absolute text-3xl opacity-30"></span>
                <img id="kitchen-preview-img" src="" class="w-full h-full object-contain z-10 drop-shadow-md"
                    onerror="this.style.display='none'; this.previousElementSibling.classList.replace('opacity-30', 'opacity-100');">
            </div>
            <div class="flex-1 flex flex-col justify-between h-full">
                <div>
                    <div id="kitchen-preview-name" class="font-bold text-sm text-white tracking-wide"></div>
                    <div id="kitchen-preview-stats" class="text-xs text-green-300 font-medium mt-1"></div>
                </div>
                <button id="kitchen-preview-btn" class="glass-button !mb-0 highlight-blue w-24 !py-1 text-xs"
                    onclick="">Makan</button>
            </div>
        </div>
    </div>

    <div id="view-bathroom" class="glass-panel-main hidden flex-col mb-3">
        <div class="glass-section-title">Aksi Kamar Mandi</div>
        <button class="glass-button" onclick="GAME.logic.takeBath()">
            <span class="glass-button-icon">🛁</span>
            <div class="glass-button-content">
                <span>Mandi</span>
                <span class="glass-button-subtext">+10% Composure, Lewati 1 Waktu</span>
            </div>
        </button>
        <div class="glass-section-title mt-4">Navigasi</div>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-apartment', false)">
            Kembali
        </button>
    </div>




    <div id="view-story-location" class="glass-panel-main hidden flex-col text-center justify-center mb-3">
        <h2 id="story-loc-title" class="text-base font-bold mb-2">Location</h2>
        <p class="text-[10px] text-gray-300 mb-6 font-light leading-relaxed">Belum ada event NPC aktif di lokasi ini
            pada waktu sekarang.</p>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-city')">Kembali ke Jalan</button>
    </div>




</div>
