<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>After Strolling - Life-Sim Visual Novel</title>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="game-container">
        <!-- UI Global -->
        <div id="toast">Message</div>
        <div id="screen-fader"></div>

        <!-- Wadah Scene (Akan diisi otomatis oleh JavaScript) -->
        <div id="scene-intro" class="scene active"></div>
        <div id="scene-input" class="scene"></div>
        <div id="scene-story" class="scene bg-black cursor-pointer overflow-hidden"
            onclick="GAME.logic.handleStoryTap()"></div>
        <div id="scene-maingame" class="scene" style="justify-content: flex-start;"></div>
        <div id="scene-gameover" class="scene bg-black cursor-pointer"></div>

        <!-- Global Bottom UI (Option & Phone) -->
        <div id="global-bottom-ui" class="absolute bottom-4 left-4 right-4 flex justify-between items-end z-30 pointer-events-none opacity-0 transition-opacity duration-1000">
            <button class="glass-hud w-7 h-7 p-0 rounded-full flex items-center justify-center hover:bg-white/20 transition-transform duration-200 active:scale-95" onclick="event.stopPropagation(); GAME.ui.toggleModal('modal-option')" aria-label="Option Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
            <button id="main-phone-btn" class="glass-hud w-12 h-12 p-0 rounded-full flex items-center justify-center hover:bg-white/20 transition-transform duration-200 active:scale-95 relative" onclick="event.stopPropagation(); GAME.ui.toggleModal('modal-phone')" aria-label="Handphone App">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
                <div id="phone-notif-dot" class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border border-black hidden animate-pulse shadow-[0_0_5px_red]"></div>
            </button>
        </div>
        
        <!-- Wadah Modal Gabungan -->
        <div id="modals-container"></div>
    </div>

    <!-- Tag Audio tetap disini agar langsung termuat -->
    <audio id="audio-tap" src="assets/sounds/tap.mp3" preload="auto"></audio>
    <audio id="audio-bgm" src="assets/sounds/main_bgm.mp3" loop preload="auto"></audio>
    <audio id="audio-intro" src="assets/sounds/intro_story.mp3" loop preload="auto"></audio>
    <audio id="audio-voice" src="" preload="auto"></audio>

    <!-- JS Utama (Gunakan type="module" agar bisa import/export) -->
    <script type="module" src="js/main.js?v=2"></script>
</body>

</html>
